<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA MD | WhatsApp Bot</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#07110e;
  color:#fff;
  min-height:100vh;
}
header{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 7%;
  border-bottom:1px solid #164b38;
  background:#081512;
}
.logo{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:25px;
  font-weight:800;
}
.logo-icon{
  width:44px;height:44px;
  border-radius:50%;
  background:#20e879;
  display:grid;
  place-items:center;
  color:#06130e;
  font-size:24px;
}
.logo span{color:#20e879}
nav{display:flex;gap:25px}
nav a{color:#ddd;text-decoration:none;font-size:14px}
.hero{
  text-align:center;
  padding:70px 20px 45px;
  background:radial-gradient(circle at center,#123b2c,#07110e 65%);
}
.hero h1{
  font-size:58px;
  letter-spacing:2px;
}
.hero h1 span{color:#20e879}
.hero p{
  color:#a8b8b2;
  margin-top:12px;
  font-size:18px;
}
.badges{
  margin-top:25px;
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}
.badge{
  border:1px solid #20e879;
  border-radius:30px;
  padding:9px 17px;
  color:#20e879;
}
.container{
  width:92%;
  max-width:1100px;
  margin:auto;
}
.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  margin:25px auto;
}
.card{
  background:#0b1b16;
  border:1px solid #174b38;
  border-radius:18px;
  padding:28px;
  box-shadow:0 10px 35px #0005;
}
.card h2{font-size:21px;margin-bottom:10px}
.card p{color:#9fb0a9;font-size:14px;line-height:1.6}
.icon{
  width:48px;height:48px;
  border-radius:14px;
  background:#20e879;
  color:#06130e;
  display:grid;
  place-items:center;
  font-size:24px;
  margin-bottom:18px;
}
input{
  width:100%;
  margin-top:18px;
  padding:15px;
  border-radius:10px;
  border:1px solid #315e4c;
  background:#06100d;
  color:white;
  font-size:16px;
  outline:none;
}
button{
  width:100%;
  margin-top:14px;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#20e879;
  color:#04100b;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}
.code{
  margin-top:18px;
  padding:22px 10px;
  border:1px dashed #20e879;
  border-radius:12px;
  text-align:center;
  font-size:27px;
  font-weight:bold;
  letter-spacing:4px;
  color:#20e879;
}
